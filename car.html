<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>CSS Car</title><style>*{margin:0;padding:0;box-sizing:border-box;}body{display:flex;justify-content:center;align-items:center;min-height:100vh;background:#e0f2fe;}.car{position:relative;width:600px;height:200px;}.car-body{position:absolute;bottom:40px;left:0;width:100%;height:90px;background:#e63946;border-radius:20px 20px 10px 10px;z-index:2;}.car-roof{position:absolute;bottom:110px;left:80px;width:440px;height:70px;background:#c1121f;border-radius: 30px 30px 10px 10px;z-index:3;}.window-left,.window-right{position:absolute;bottom:115px;width:130px;height:50px;background:#a8dadc;border-radius:15px;z-index:4;}.window-left{left:100px;}.window-right{left:370px;}.car-door-left,.car-door-right{position:absolute;bottom:55px;width:130px;height:70px;background:#d62828;border:2px solid #a00000;border-radius:5px;z-index:5;}.car-door-left{left:100px;}.car-door-right{left:370px;}.headlight{position:absolute;bottom:50px;width:20px;height:30px;background:#ffd166;border-radius:0 10px 10px 0;z-index:6;}.headlight.left{left:0;}.headlight.right{right:0;border-radius:10px 0 0 10px;}.taillight{position:absolute;bottom:50px;width:15px;height:25px;background:#dc2f02;border-radius:10px 0 0 10px;z-index:6;}.taillight.left{left:0;bottom:50px;border-radius:0 10px 10px 0;background:#dc2f02;}.taillight.right{right:0;}.wheel{position:absolute;bottom:0;width:80px;height:80px;background:#222;border-radius:50%;z-index:10;}.wheel::after{content:'';position:absolute;top:15px;left:15px;width:50px;height:50px;background:#555;border-radius:50%;border:2px solid #888;}.wheel-left{left:100px;}.wheel-right{right:100px;}.ground{position:absolute;bottom:0;left:0;width:100%;height:8px;background:#6b705c;border-radius:4px;z-index:1;}.exhaust{position:absolute;bottom:30px;right:-10px;width:20px;height:12px;background:#999;border-radius:0 5px 5px 0;z-index:2;}</style></head><body><div class="car"><div class="car-body"></div><div class="car-roof"></div><div class="window-left"></div><div class="window-right"></div><div class="car-door-left"></div><div class="car-door-right"></div><div class="headlight left"></div><div class="headlight right"></div><div class="taillight left"></div><div class="taillight right"></div><div class="wheel wheel-left"></div><div class="wheel wheel-right"></div><div class="ground"></div><div class="exhaust"></div></div></body></html>
